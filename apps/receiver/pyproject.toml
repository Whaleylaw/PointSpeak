[project]
name = "pointspeak-receiver"
version = "0.1.0"
description = "Local PointSpeak receiver and Hermes bridge"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.11.0"
]

[project.scripts]
pointspeak-receiver = "pointspeak_receiver.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pointspeak_receiver"]
